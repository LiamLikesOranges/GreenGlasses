<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>greenglasses</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="logo-row">
        <span class="logo-dot"></span>
        <h1>greenglasses</h1>
      </div>
      <p id="status" class="status">Idle</p>
    </header>

    <section class="progress-section">
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <span id="progress-label" class="progress-label">0 / 0</span>
    </section>

    <section class="button-row">
      <button id="btn-prepare" class="btn btn-secondary">1. Prepare Data</button>
      <button id="btn-train" class="btn btn-secondary">2. Train</button>
      <button id="btn-sample" class="btn btn-secondary">3. Generate Sample</button>
      <button id="btn-all" class="btn btn-primary">Run Full Pipeline</button>
      <button id="btn-stop" class="btn btn-danger" disabled>Stop</button>
    </section>

    <section class="log-section">
      <pre id="log" class="log"></pre>
    </section>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="app.js"></script>
</body>
</html>
